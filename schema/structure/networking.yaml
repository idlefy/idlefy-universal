properties:
  services:
    type: object
    propertyNames:
      pattern: "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$"
      maxLength: 63
    additionalProperties:
      $ref: "#/$defs/StandaloneServiceSpec"
  ingresses:
    type: object
    additionalProperties:
      $ref: "#/$defs/IngressConfig"
  httpRoutes:
    type: object
    additionalProperties:
      $ref: "#/$defs/HttpRouteConfig"
