suite: test service
templates:
  - service.yaml
tests:
  - it: should create a service with specified configuration
    set:
      services:
        test-service:
          type: ClusterIP
          ports:
            - name: http
              port: 80
              targetPort: 8080
            - name: https
              port: 443
              targetPort: 8443
    asserts:
      - isKind:
          of: Service
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: test-service
      - equal:
          path: spec.type
          value: ClusterIP
      - matchSnapshot:
          path: spec.ports 
  - it: should render appProtocol when set on a port
    set:
      services:
        api:
          ports:
            - name: grpc
              port: 50051
              targetPort: 50051
              appProtocol: grpc
    asserts:
      - equal:
          path: spec.ports[0].appProtocol
          value: grpc
