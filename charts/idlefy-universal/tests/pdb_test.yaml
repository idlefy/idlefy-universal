suite: test pdb
templates:
  - deployment.yaml
  - pdb.yaml
tests:
  - it: should create a pod disruption budget when autoCreatePdb is enabled
    set:
      deployments:
        test-app:
          containers:
            main:
              image: nginx
              imageTag: latest
          autoCreatePdb: true
          pdb:
            maxUnavailable: 1
    asserts:
      - matchSnapshot: {}
  - it: renders an auto-created PDB when no pdb block is given
    set:
      deployments:
        p:
          autoCreatePdb: true
          containers:
            main: {image: nginx, imageTag: "1"}
    template: pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
