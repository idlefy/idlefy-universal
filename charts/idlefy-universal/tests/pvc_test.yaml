suite: test pvc
templates:
  - pvc.yaml
tests:
  - it: should render volumeMode when set
    set:
      persistentVolumeClaims:
        data:
          accessModes:
            - ReadWriteOnce
          size: 10Gi
          volumeMode: Block
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: spec.volumeMode
          value: Block
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
