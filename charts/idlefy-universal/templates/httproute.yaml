{{- include "idlefy-universal.validate" . -}}
{{- /* Standalone HTTPRoutes */ -}}
{{- if .Values.httpRoutes }}
{{- range $routeName, $routeConfig := .Values.httpRoutes }}
{{- $defaultedRoute := include "idlefy-universal.httpRouteDefaults" (dict "httpRoute" $routeConfig "general" (index ($.Values.generic | default dict) "httpRoutesGeneral" | default dict)) | fromYaml }}
{{- $globalDomain := "" }}
{{- if and $.Values.generic $.Values.generic.ingressesGeneral }}
  {{- $globalDomain = $.Values.generic.ingressesGeneral.domain | default "" | trim }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- include "idlefy-universal.resourceMetadata" (dict "name" $routeName "root" $ "labels" $routeConfig.labels "annotations" $defaultedRoute.annotations) | nindent 2 }}
spec:
  parentRefs:
    {{- toYaml $defaultedRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- range $defaultedRoute.hostnames }}
    - {{ include "idlefy-universal.computedIngressHost" (dict "host" .host "subdomain" .subdomain "globalDomain" $globalDomain) | trim | quote }}
    {{- end }}
  rules:
    {{- range $rule := $defaultedRoute.rules }}
    - matches:
        {{- range $match := $rule.matches }}
        - path:
            type: {{ $match.path.type | default "PathPrefix" }}
            value: {{ $match.path.value | default "/" }}
          {{- if $match.headers }}
          headers:
            {{- range $header := $match.headers }}
            - name: {{ $header.name }}
              value: {{ $header.value | quote }}
              {{- if $header.type }}
              type: {{ $header.type }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $match.queryParams }}
          queryParams:
            {{- range $qp := $match.queryParams }}
            - name: {{ $qp.name }}
              value: {{ $qp.value | quote }}
              {{- if $qp.type }}
              type: {{ $qp.type }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      backendRefs:
        {{- if $rule.backendRefs }}
        {{- range $ref := $rule.backendRefs }}
        - name: {{ $ref.name | default $routeName }}
          port: {{ $ref.port | default 80 }}
          {{- if $ref.namespace }}
          namespace: {{ $ref.namespace }}
          {{- end }}
          {{- if hasKey $ref "group" }}
          group: {{ $ref.group | quote }}
          {{- end }}
          {{- if $ref.kind }}
          kind: {{ $ref.kind }}
          {{- end }}
          {{- if $ref.weight }}
          weight: {{ $ref.weight }}
          {{- end }}
        {{- end }}
        {{- else }}
        - name: {{ $routeName }}
          port: 80
        {{- end }}
    {{- end }}
---
{{- end }}
{{- end }}

{{- /* Auto-created HTTPRoutes from deployments */ -}}
{{- range $deploymentName, $deploymentConfig := .Values.deployments }}
{{- if $deploymentConfig.autoCreateHttpRoute }}
{{/* No `{{-` here: the previous document's `---` needs the newline that a left-trim would eat. */}}
{{ include "idlefy-universal.autoHttpRoute" (dict "deploymentName" $deploymentName "deploymentConfig" $deploymentConfig "root" $) }}
---
{{- end }}
{{- end }}
