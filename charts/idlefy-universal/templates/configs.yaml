{{- include "idlefy-universal.validate" . -}}
{{- range $name, $config := .Values.configs }}
apiVersion: v1
kind: {{ if eq $config.type "secret" }}Secret{{ else }}ConfigMap{{ end }}
metadata:
  name: {{ include "idlefy-universal.configName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "idlefy-universal.labels" (dict "Chart" $.Chart "Release" $.Release "name" $name) | nindent 4 }}
    {{- $extraLabels := include "idlefy-universal.mergeLabels" (dict "root" $ "resourceLabels" $config.labels) }}
    {{- if $extraLabels }}
    {{- $extraLabels | nindent 4 }}
    {{- end }}
  {{- /* One dict, emitted once: appending the user's annotations after literal hook keys produced a
         duplicate map key whenever the user set one of them (and ConfigSpec.annotations.examples[0]
         is exactly those two keys). `merge dst src` never overwrites dst, so the user's value wins
         and the chart's install ordering is the default, not a hard-coded override. */}}
  {{- $mergedAnnotations := include "idlefy-universal.mergeAnnotations" (dict "root" $ "resourceAnnotations" $config.annotations) | fromYaml }}
  {{- $hookAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" }}
  annotations:
    {{- toYaml (merge (dict) $mergedAnnotations $hookAnnotations) | nindent 4 }}
{{- if eq $config.type "secret" }}
type: Opaque
data:
  {{- range $key, $value := $config.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- else }}
{{- if $config.data }}
data:
  {{- range $key, $value := $config.data }}
  {{- if contains "\n" ($value | toString) }}
  {{ $key }}: |
{{- $value | nindent 4 }}
  {{- else }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if $config.binaryData }}
binaryData:
  {{- range $key, $value := $config.binaryData }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
---
{{- end }}
