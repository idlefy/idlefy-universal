{{- range $deploymentName, $deploymentConfig := .Values.deployments }}
{{- $renderSA := or $deploymentConfig.autoCreateServiceAccount (and $deploymentConfig.serviceAccount (not $deploymentConfig.autoCreateServiceAccount)) }}
{{- if $renderSA }}
{{- $saCfg := default dict $deploymentConfig.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saCfg.name | default $deploymentName }}
  labels:
    {{- include "idlefy-universal.labels" (dict "Chart" $.Chart "Release" $.Release "name" $deploymentName) | nindent 4 }}
    {{- $extraLabels := include "idlefy-universal.mergeLabels" (dict "root" $ "resourceLabels" $saCfg.labels) }}
    {{- if $extraLabels }}
    {{- $extraLabels | nindent 4 }}
    {{- end }}
  {{- $mergedAnnotations := include "idlefy-universal.mergeAnnotations" (dict "root" $ "resourceAnnotations" $saCfg.annotations) }}
  {{- if $mergedAnnotations }}
  annotations:
    {{- $mergedAnnotations | nindent 4 }}
  {{- end }}
{{- if hasKey $saCfg "automountServiceAccountToken" }}
automountServiceAccountToken: {{ $saCfg.automountServiceAccountToken }}
{{- end }}
{{- $genericPull := list }}
{{- if and $.Values.generic $.Values.generic.extraImagePullSecrets }}
{{- $genericPull = $.Values.generic.extraImagePullSecrets }}
{{- end }}
{{- $pullSecrets := concat (default list $saCfg.imagePullSecrets) $genericPull }}
{{- if $pullSecrets }}
imagePullSecrets:
  {{- toYaml $pullSecrets | nindent 2 }}
{{- end }}
---
{{- end }}
{{- end }}
