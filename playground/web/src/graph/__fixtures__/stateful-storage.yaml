apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  labels:
    helm.sh/chart: idlefy-universal-1.2.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: files
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: files
spec:
