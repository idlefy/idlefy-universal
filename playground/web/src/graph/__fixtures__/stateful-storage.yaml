apiVersion: batch/v1
kind: Job
metadata:
  name: web-migrations
  labels:
    helm.sh/chart: idlefy-universal-1.2.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: web-migrations
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: web-migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        helm.sh/chart: idlefy-universal-1.2.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: web-migrations
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: web-migrations
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: nginx:1.27-alpine
        args:
          - nginx
          - -v
        ports:
          - name: http
            containerPort: 80
            protocol: TCP
        envFrom:
          - secretRef:
              name: app-secrets
          - configMapRef:
              name: app-config
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
