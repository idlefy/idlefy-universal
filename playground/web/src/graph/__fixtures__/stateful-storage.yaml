        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: files
    spec:
      containers:
      - name: main
        image: nginx:1.27-alpine
        volumeMounts:
          - name: uploads
            mountPath: /data
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
