apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  labels:
    helm.sh/chart: idlefy-universal-1.2.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: controller
    app.kubernetes.io/instance: demo
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controller
      app.kubernetes.io/instance: demo
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        helm.sh/chart: idlefy-universal-1.2.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: controller
        app.kubernetes.io/instance: demo
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: controller
      containers:
      - name: main
        image: busybox:1.36
        command:
          - sh
          - -c
          - while true; do date; sleep 60; done
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
